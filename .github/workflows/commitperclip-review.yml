name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.
#
# Fork note (tyrxtech): upstream GitHub App "commitperclip" (App ID 3718661) is
# owned by paperclipai. Without Actions secret COMMITPERCLIP_KEY (PEM) AND an
# installation on this org, bot token + quality gates cannot run. Dependency
# Review still runs; bot gates skip cleanly instead of failing greening.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Check COMMITPERCLIP_KEY presence
        id: key
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
        run: |
          if [ -z "$COMMITPERCLIP_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COMMITPERCLIP_KEY is not set. Skipping commitperclip bot token + quality gates on this fork. Dependency Review above still ran. To restore bot review: obtain PEM from paperclipai admins for App commitperclip (3718661), install the app on tyrxtech, set repo Actions secret COMMITPERCLIP_KEY, then re-enable this workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Generate commitperclip token
        id: token
        if: steps.key.outputs.present == 'true'
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}

      - name: Run quality gates
        id: quality
        if: steps.key.outputs.present == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          steps.key.outputs.present == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
